org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
# Kotlin 增量编译在 Windows 跨盘符下有 bug：项目在 D:\ 而 Kotlin daemon 工作目录在
# C:\Users\...\AppData，relativize 抛 "different roots" 导致增量缓存无法关闭，
# android_file_picker:compileReleaseKotlin 必现失败。禁用增量编译绕过（仅影响编译速度）。
kotlin.incremental=false

# 项目位于含中文的路径（D:\Workspace\项目代码\...）。AGP 默认拒绝非 ASCII 路径，
# 但实测只要 SDK/CMake 走 ASCII 影射（见 rebuild.ps1），构建本身可以正常完成，
# 故显式关闭该路径检查。CMake 产物若出现 MalformedJsonException，说明 SDK 路径
# 又回落到中文路径，请检查 rebuild.ps1 的 ASCII 影射分支是否生效。
android.overridePathCheck=true
